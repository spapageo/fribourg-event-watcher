spring:
  application:
    name: fribourg-events-digest
  datasource:
    url: jdbc:sqlite:${digest.db-path}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Actuator: health and info only. There is no inbound digest-trigger endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

digest:
  cron: "${DIGEST_CRON:0 0 7 * * MON}"
  zone: "${DIGEST_ZONE:Europe/Zurich}"
  window-days: ${DIGEST_WINDOW_DAYS:14}
  run-on-startup: ${DIGEST_RUN_ON_STARTUP:false}
  dry-run: ${DIGEST_DRY_RUN:false}
  send-failure-notice: ${DIGEST_SEND_FAILURE_NOTICE:false}
  show-merged-count: ${DIGEST_SHOW_MERGED_COUNT:true}
  db-path: ${DB_PATH:../data/digest.db}
  http:
    request-timeout: ${DIGEST_HTTP_TIMEOUT:10s}
  browser:
    headless: ${DIGEST_BROWSER_HEADLESS:true}
    width: ${DIGEST_BROWSER_WIDTH:1920}
    height: ${DIGEST_BROWSER_HEIGHT:1080}
    user-agent: ${DIGEST_BROWSER_USER_AGENT:fribourg-events-digest/1.0}
    page-load-timeout: ${DIGEST_BROWSER_PAGE_LOAD_TIMEOUT:30s}
    ready-state-timeout: ${DIGEST_BROWSER_READY_STATE_TIMEOUT:30s}
  rate-limit:
    per-second: ${DIGEST_RATE_LIMIT_PER_SECOND:1}
    max-per-run: ${DIGEST_MAX_REQUESTS_PER_RUN:60}
  dedup:
    title-threshold: ${DEDUP_TITLE_THRESHOLD:0.90}
    venue-threshold: ${DEDUP_VENUE_THRESHOLD:0.85}
    date-window-days: ${DEDUP_DATE_WINDOW_DAYS:1}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    part-limit: ${TELEGRAM_PART_LIMIT:4000}
  sources:
    insitu:
      enabled: ${SOURCE_INSITU_ENABLED:true}
    bka:
      enabled: ${SOURCE_BKA_ENABLED:true}
    eventfrog:
      enabled: ${SOURCE_EVENTFROG_ENABLED:true}
