[versions]
springBoot = "4.1.2"
sqlite = "3.54.1.0"
flyway = "12.4.0"
selenium = "4.52.0"
jsoup = "1.23.2"
wiremock = "3.13.1"
archunit = "1.5.1"
spotless = "8.10.4"
googleJavaFormat = "2.0.0"
jacoco = "0.8.14"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-sqlite = { module = "org.flywaydb:flyway-database-nc-sqlite", version.ref = "flyway" }
hibernate-community-dialects = { module = "org.hibernate.orm:hibernate-community-dialects" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
selenium-java = { module = "org.seleniumhq.selenium:selenium-java", version.ref = "selenium" }

wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
