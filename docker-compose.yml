# Single-service deployment for Unraid (or any Docker host).
#
#   cp .env.example .env        # then fill in Telegram + settings
#   mkdir -p data
#   docker compose up -d --build
#
# Chromium needs a large /dev/shm, so shm_size is raised below (equivalently
# `--shm-size=1g` for `docker run`). SQLite lives on the ./data bind mount; the
# container runs non-root as PUID:PGID (default 1000:1000).
services:
  digest:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fribourg-events-digest:dev
    container_name: digest
    env_file:
      - .env
    environment:
      DB_PATH: /data/digest.db
      TZ: Europe/Zurich
    volumes:
      - ./data:/data
    ports:
      - "${DIGEST_HTTP_PORT:-8080}:8080"
    shm_size: "1gb"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
